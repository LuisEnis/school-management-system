services:

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: schoolmanagement-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1' -C || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./backend/SchoolManagement/SchoolManagement.API
      dockerfile: Dockerfile
    image: schoolmanagement-api
    container_name: schoolmanagement-api
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SchoolManagementDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True"
      ASPNETCORE_ENVIRONMENT: "Development"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: schoolmanagement-frontend
    container_name: schoolmanagement-frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqlserver-data: