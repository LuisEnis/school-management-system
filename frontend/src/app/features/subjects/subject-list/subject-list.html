<div class="page-header">
  <h1>Subjects</h1>

  <button class="add-btn" routerLink="/subjects/new">
    + Add New
  </button>
</div>

<table class="table">
  <thead>
    <tr>
      <th>Name</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let subject of subjects$ | async">
      <td>{{ subject.name }}</td>

      <td class="actions">
        <button class="edit-btn"
                [routerLink]="['/subjects/edit', subject.id]">
          Edit
        </button>

        <button class="delete-btn"
                (click)="delete(subject.id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>
