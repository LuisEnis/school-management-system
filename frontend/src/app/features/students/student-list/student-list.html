<div class="page-header">
  <h1>Students</h1>

  <button class="add-btn" routerLink="/students/new">
    + Add New
  </button>
</div>

<table class="table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Full Name</th>
      <th>Email</th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let student of students$ | async">
      <td>{{ student.id }}</td>
      <td>{{ student.fullName }}</td>
      <td>{{ student.email }}</td>

      <td class="actions">
        <button class="edit-btn"
                [routerLink]="['/students/edit', student.id]">
          Edit
        </button>

        <button class="delete-btn"
                (click)="delete(student.id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>
