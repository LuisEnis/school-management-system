<div class="page-header">
  <h1>Students</h1>

  <button class="add-btn" routerLink="/students/new">
    + Add New
  </button>
</div>

<div class="search-container">

  <input type="text" class="search-input" placeholder="Search students..." [value]="search" (input)="onSearch($event)">

</div>

<table class="table">
  <thead>
    <tr>
      <th class="sortable" (click)="onSort('fullname')">
        
        Full Name
        
        <span class="sort-icon">
          {{ getSortIcon('fullname') }}
        </span>
      </th>
      <th class="sortable" (click)="onSort('email')">
        
        Email

        <span class="sort-icon">
          {{ getSortIcon('email') }}
        </span>
      </th>
      <th>Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let student of students$ | async">
      <td>{{ student.fullName }}</td>
      <td>{{ student.email }}</td>

      <td class="actions">
        <button class="edit-btn"
                [routerLink]="['/students/edit', student.id]">
          Edit
        </button>

        <button class="delete-btn"
                (click)="delete(student.id)">
          Delete
        </button>
      </td>
    </tr>
  </tbody>
</table>

<app-pagination
  [pageNumber]="pageNumber"
  [pageSize]="pageSize"
  [totalPages]="totalPages"
  [totalCount]="totalCount"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)">
</app-pagination>
