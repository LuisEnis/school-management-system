<div class="form-container">

  <h2>My Profile</h2>


  <form
    [formGroup]="form"
    (ngSubmit)="save()"
    class="form">


    <div class="form-group">

      <label>
        First Name
      </label>

      <input
        formControlName="firstName"
        autocomplete="given-name" />

    </div>


    <div class="form-group">

      <label>
        Last Name
      </label>

      <input
        formControlName="lastName"
        autocomplete="family-name" />

    </div>


    <div class="form-group">

      <label>
        Username
      </label>

      <input
        formControlName="username"
        autocomplete="username" />

    </div>


    <div class="form-group">

      <label>
        Email
      </label>

      <input
        type="email"
        formControlName="email"
        autocomplete="email" />

    </div>


    <button
      type="submit"
      class="submit-btn"
      [disabled]="form.invalid">

      Save Changes

    </button>


  </form>

</div>
