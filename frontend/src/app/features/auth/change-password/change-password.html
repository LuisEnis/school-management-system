<div class="form-container">


<h2>
Change Password
</h2>



<form
class="form"
[formGroup]="form"
(ngSubmit)="save()">



<div class="form-group">

<label>
Current Password
</label>


<input
type="password"
formControlName="currentPassword"/>

</div>




<div class="form-group">

<label>
New Password
</label>


<input
type="password"
formControlName="newPassword"/>

</div>




<div class="form-group">

<label>
Confirm New Password
</label>


<input
type="password"
formControlName="confirmNewPassword"/>

</div>




<p
class="success"
*ngIf="successMessage">

{{successMessage}}

</p>



<p
class="error"
*ngIf="errorMessage">

{{errorMessage}}

</p>




<button
type="submit"
class="submit-btn"
[disabled]="form.invalid">

Change Password

</button>



</form>


</div>
