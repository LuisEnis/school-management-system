<div class="page-header">
  <h1>Secretaries</h1>

  <button
    *ngIf="authService.isDirector()"
    class="add-btn"
    routerLink="/secretaries/new">
    + Add New
  </button>
</div>

<table class="table">

  <thead>
    <tr>
      <th>Full Name</th>
      <th>Email</th>
      <th *ngIf="authService.isDirector()">Actions</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let secretary of secretaries$ | async">

      <td>
        {{ secretary.firstName }} {{ secretary.lastName }}
      </td>

      <td>
        {{ secretary.email }}
      </td>

      <td
        *ngIf="authService.isDirector()"
        class="actions">

        <button
          class="edit-btn"
          [routerLink]="['/secretaries/edit', secretary.id]">
          Edit
        </button>

        <button
          class="delete-btn"
          (click)="delete(secretary.id)">
          Delete
        </button>

      </td>

    </tr>

  </tbody>

</table>
