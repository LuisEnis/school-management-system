<div class="page-header">
  <h1>Secretaries</h1>

  <button
    *ngIf="authService.isDirector()"
    class="add-btn"
    routerLink="/secretaries/new">
    + Add New
  </button>
</div>

<div class="search-container">

  <input
    type="text"
    placeholder="Search secretaries..."
    #searchInput
    (input)="onSearch(searchInput.value)"
  >

</div>

<table class="table">

  <thead>
    <tr>
      <th class="sortable" (click)="onSort('fullname')">

        Full Name

        <span class="sort-icon">
          {{ getSortIcon('fullname') }}
        </span>

      </th>

      <th class="sortable" (click)="onSort('email')">

        Email

        <span class="sort-icon">
          {{ getSortIcon('email') }}
        </span>

      </th>
      
      <th *ngIf="authService.isDirector()">Actions</th>
    </tr>
  </thead>

  <tbody>

    <tr *ngFor="let secretary of secretaries$ | async">

      <td>
        {{ secretary.firstName }} {{ secretary.lastName }}
      </td>

      <td>
        {{ secretary.email }}
      </td>

      <td
        *ngIf="authService.isDirector()"
        class="actions">

        <button
          class="edit-btn"
          [routerLink]="['/secretaries/edit', secretary.id]">
          Edit
        </button>

        <button
          class="delete-btn"
          (click)="delete(secretary.id)">
          Delete
        </button>

      </td>

    </tr>

  </tbody>

</table>

<app-pagination
  [pageNumber]="pageNumber"
  [pageSize]="pageSize"
  [totalPages]="totalPages"
  [totalCount]="totalCount"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)">
</app-pagination>
