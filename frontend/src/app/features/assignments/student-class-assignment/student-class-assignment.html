<div class="page-header">

  <h1>
    Student Class Assignments
  </h1>


  <button
    class="add-btn"
    routerLink="/assignments/student-class/new">

    + Add New

  </button>


</div>



<table class="table">

<thead>

<tr>

<th>Student</th>
<th>Class</th>
<th>Actions</th>

</tr>

</thead>

<ng-container *ngIf="assignments$ | async as assignments">
  <tbody>


  <tr *ngFor="let assignment of assignments">


  <td>
  {{ assignment.studentName }}
  </td>


  <td>
  {{ assignment.schoolClassName }}
  </td>


  <td class="actions">


  <button
  class="delete-btn"
  (click)="delete(
  assignment.studentId,
  assignment.schoolClassId
  )">

  Delete

  </button>


  </td>


  </tr>



  <tr *ngIf="assignments.length === 0">

  <td colspan="3" class="empty">

  No assignments found.

  </td>

  </tr>


  </tbody>
</ng-container>
</table>
